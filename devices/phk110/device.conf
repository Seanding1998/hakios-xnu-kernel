# OnePlus Ace 2 (PHK110): HakiOS ported from the redwood (SM7325) reference
# device to SM8475 ("Cape"); see PORT-NOTES.md and docs/phk110/ in this branch.
#
# Every value below was verified on the actual phone; the boot log trail lives
# in docs/phk110/STATUS.md (Boot #1-#39) and docs/phk110/waves/.
NAME="OnePlus Ace 2 (PHK110)"
KIND=phone
SOC="Qualcomm Snapdragon 8+ Gen 1 (SM8475, cape)"
UEFI_TARGET=udon
UEFI_FD=${UEFI_FD:-}
DTB=out/phk110/phk110.dtb
# Confirmed against this phone's XBL: the udonPkg FD is built at 0xA7100000
# (docs/phk110/waves/wave4-udon-rebuild.md); DEBUG UEFI screen, loader USB and
# the payload handoff verified on the device.
FD_BASE=0xA7100000
FD_SIZE=0x400000
# PAYLOAD_BASE must be 0xF4000000 here: redwood's 0xF0000000 default is not
# mapped on this board and asserts in parse_payload before anything prints
# (docs/phk110/waves/wave21_2-ssh-catch.md, finding F10).
PAYLOAD_BASE=0xF4000000
WIFI_ATH11K=1
WIFI_ATH10K=0
# The working boot-args line as of the Wave 27/28 verdicts: touch probe, the
# three buttons, all 8 cores, UFS read+write with /private/var kept between
# boots, en0 on the loader's USB channel, SSH reachable, 1800 s session cap
# (longer sessions hit the vnode-table panic, F6, docs/phk110/waves/wave21-ssh-e2e.md).
BOOTARGS="cpus=8 small_cores_after=0 touchscreen=1 buttons=1 cpufreq=1 gpu=0 wifi=0 modem=0 adsp=0 ufs=2 ufs_write=1 var_hfs=ufs_darwin_data root_apfs=ufs_darwin hw_target=D22ap en0_addr=10.0.0.2 loader_return_after=1800"
DEFAULT_SECS=1800
# Real init chain: flashboot.apfs resident md0 + root.apfs md1, darwin system
# volume + both cryptexes, Apple launchd takes pid 1 (Boot #24/#25);
# rc.jobs.ssh starts sshd from the Procursus /var/jb prefix.
USERLAND_VARS="GL=1 REST=1 QUIET=1 OSLOG= RC=$ROOT/userland/rc.jobs.ssh"
FIRMWARE=""
